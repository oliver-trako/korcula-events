name: Event ingestion

on:
  workflow_dispatch:
    inputs:
      shadow:
        description: Shadow mode (extract/verify/decide but don't publish or open issues)
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "17 5 * * *" # daily: event ingestion
    - cron: "0 6 1 * *"  # monthly (1st): source discovery

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    if: github.event.schedule == '17 5 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run ingestion pipeline
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.shadow }}" = "true" ]; then
            node ingestion/run-ingest.mjs --shadow
          else
            node ingestion/run-ingest.mjs
          fi

      - name: Commit any published events
        run: |
          git config user.name "korcula-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/events.json ingestion/data/pending-events.json ingestion/data/run-log/
          if ! git diff --cached --quiet; then
            git commit -m "Automated event ingestion: $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Nothing to commit this run."
          fi

  discover-sources:
    if: github.event.schedule == '0 6 1 * *'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run source discovery
        env:
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_ENGINE_ID: ${{ secrets.GOOGLE_SEARCH_ENGINE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ingestion/run-discover-sources.mjs

      - name: Commit discovered sources
        run: |
          git config user.name "korcula-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ingestion/data/discovered-sources.json
          if ! git diff --cached --quiet; then
            git commit -m "Automated source discovery: $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Nothing to commit this run."
          fi
