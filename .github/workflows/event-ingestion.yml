name: Event ingestion

on:
  workflow_dispatch:
    inputs:
      shadow:
        description: Shadow mode (extract/verify/decide but don't publish or open issues)
        type: boolean
        required: false
        default: false
  schedule:
    # Daily ingestion cron re-enabled 2026-08-15: the 2026-08-13 manual run came back clean
    # (7 real events auto-published, first since the 2026-08-10 rate-limiting issue, and the
    # review-issue backlog has stayed at zero since) -- the bar set in the disabling comment
    # this replaces has been met.
    - cron: "17 5 * * *"  # daily: event ingestion
    - cron: "0 6 1 * *"  # monthly (1st): source discovery

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    # Fires on manual dispatch, or the daily "17 5 * * *" cron -- but not the monthly
    # "0 6 1 * *" source-discovery cron, which the discover-sources job below owns.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 5 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run ingestion pipeline
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed via env + $VAR below rather than interpolated directly into the shell script --
          # not currently exploitable (this input is typed `boolean`, so GitHub restricts its
          # value to literal true/false), but consistent with how the secrets above are handled,
          # and stays safe if this input's type is ever loosened to free text.
          SHADOW_MODE: ${{ github.event.inputs.shadow }}
        run: |
          if [ "$SHADOW_MODE" = "true" ]; then
            node ingestion/run-ingest.mjs --shadow
          else
            node ingestion/run-ingest.mjs
          fi

      - name: Commit any published events
        # Runs even if the ingestion step failed: it can fail *after* already publishing
        # events and writing pending-events.json (e.g. a downstream notification error), and
        # by default a failed step skips every step after it -- which previously discarded a
        # correctly-published event because an unrelated GitHub Issue call failed. The job's
        # overall status still reflects the ingestion step's outcome; this just stops
        # already-correct file writes from being thrown away along with it.
        if: always()
        run: |
          git config user.name "korcula-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/events.json ingestion/data/pending-events.json ingestion/data/run-log/
          if ! git diff --cached --quiet; then
            git commit -m "Automated event ingestion: $(date -u +%Y-%m-%d)"
            # main can move between checkout and here (e.g. someone pushing by hand while this
            # runs, or the daily and manually-dispatched runs overlapping) -- a plain `git push`
            # then just fails outright as a non-fast-forward. Rebase onto the latest main and
            # retry a few times before giving up; these files are bot-managed and rarely edited
            # concurrently by a human, so a real conflict here should be rare.
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt $attempt) -- fetching and rebasing onto latest main."
              git fetch origin main
              if ! git rebase origin/main; then
                echo "Rebase conflict -- not resolvable automatically. Leaving the commit local; rerun the workflow after resolving on main."
                git rebase --abort
                exit 1
              fi
              sleep $((attempt * 5))
            done
          else
            echo "Nothing to commit this run."
          fi

  discover-sources:
    if: github.event.schedule == '0 6 1 * *'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run source discovery
        env:
          BING_SEARCH_API_KEY: ${{ secrets.BING_SEARCH_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ingestion/run-discover-sources.mjs

      - name: Commit discovered sources
        if: always()
        run: |
          git config user.name "korcula-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ingestion/data/discovered-sources.json
          if ! git diff --cached --quiet; then
            git commit -m "Automated source discovery: $(date -u +%Y-%m-%d)"
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt $attempt) -- fetching and rebasing onto latest main."
              git fetch origin main
              if ! git rebase origin/main; then
                echo "Rebase conflict -- not resolvable automatically. Leaving the commit local; rerun the workflow after resolving on main."
                git rebase --abort
                exit 1
              fi
              sleep $((attempt * 5))
            done
          else
            echo "Nothing to commit this run."
          fi
